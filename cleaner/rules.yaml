# =====================================================================
# CleanBoost — Rule dọn rác (Phase 1: chỉ MỨC 1 = tiêu chuẩn, an toàn)
# Muốn dọn thêm chỗ mới: thêm 1 rule vào file này, KHÔNG cần sửa code.
# Trường:
#   id, name, level (1/2/3), os (windows/linux), paths, patterns,
#   exclude, min_age_days, requires_admin, risk (low/medium/high),
#   default_on, action (quarantine/delete), note
#   special: recycle_bin | trash | journal (xử lý riêng, không duyệt paths)
# =====================================================================
version: 1

rules:
  # ------------------------- WINDOWS -------------------------
  - id: win_user_temp
    name: "User temp files"
    level: 1
    os: [windows]
    paths: ["%TEMP%", "%LOCALAPPDATA%\\Temp"]
    patterns: ["*"]
    exclude: []
    min_age_days: 1
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "No effect. Running apps automatically skip files in use."
    note: "Only files older than 1 day; locked files are skipped"

  - id: win_recycle_bin
    name: "Recycle Bin"
    level: 1
    os: [windows]
    special: recycle_bin
    requires_admin: false
    risk: low
    default_on: true
    action: delete
    impact: "Files in the Recycle Bin will be gone forever. Check carefully before cleaning."

  - id: win_browser_cache
    name: "Browser caches (Chrome/Edge/CocCoc/...)"
    level: 1
    os: [windows]
    paths:
      - "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Cache"
      - "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\Code Cache"
      - "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Default\\GPUCache"
      - "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\Cache"
      - "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\Code Cache"
      - "%LOCALAPPDATA%\\Microsoft\\Edge\\User Data\\Default\\GPUCache"
      - "%LOCALAPPDATA%\\BraveSoftware\\Brave-Browser\\User Data\\Default\\Cache"
      - "%LOCALAPPDATA%\\CocCoc\\Browser\\User Data\\Default\\Cache"
      - "%LOCALAPPDATA%\\CocCoc\\Browser\\User Data\\Default\\Code Cache"
      - "%LOCALAPPDATA%\\Opera Software\\Opera Stable\\Cache"
      - "%APPDATA%\\Mozilla\\Firefox\\Profiles\\*\\cache2"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Browsers re-download images and web files - first page loads a bit slower. No passwords or bookmarks lost."
    note: "Cookies, passwords and bookmarks are untouched"

  - id: win_discord_cache
    name: "Discord cache"
    level: 1
    os: [windows]
    paths:
      - "%APPDATA%\\discord\\Cache"
      - "%APPDATA%\\discord\\Code Cache"
      - "%APPDATA%\\discord\\GPUCache"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Discord re-downloads images/files - no messages lost."

  - id: win_zalo_tmp
    name: "Zalo temp files"
    level: 1
    os: [windows]
    paths: ["%LOCALAPPDATA%\\ZaloPC"]
    patterns: ["*.tmp", "*.temp"]
    exclude: []
    min_age_days: 1
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "No messages lost. Zalo may re-download some images."
    note: "Only temp files - chat data is untouched"

  - id: win_thumbnail_cache
    name: "Thumbnail cache"
    level: 1
    os: [windows]
    paths: ["%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer\\thumbcache_*.db"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Windows rebuilds thumbnails - first folder open a bit slower."
    note: "Windows rebuilds it; first folder open is a bit slower"

  - id: win_wer_queue
    name: "Windows Error Reporting queue"
    level: 1
    os: [windows]
    paths: ["%LOCALAPPDATA%\\Microsoft\\Windows\\WER\\ReportQueue"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Only pending error reports - no effect."

  # ------------------------- LINUX -------------------------
  - id: lin_home_cache
    name: "Home .cache"
    level: 1
    os: [linux]
    paths: ["~/.cache"]
    patterns: ["*"]
    exclude: []
    min_age_days: 1
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Apps rebuild cache when needed - first launch may be slower."
    note: "Only files older than 1 day"

  - id: lin_tmp
    name: "/tmp (files older than 1 day)"
    level: 1
    os: [linux]
    paths: ["/tmp"]
    patterns: ["*"]
    exclude: []
    min_age_days: 1
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Only temp files older than 1 day."

  - id: lin_trash
    name: "Trash"
    level: 1
    os: [linux]
    special: trash
    requires_admin: false
    risk: low
    default_on: true
    action: delete
    impact: "Files in the trash will be gone forever."

  - id: lin_browser_cache
    name: "Browser caches"
    level: 1
    os: [linux]
    paths:
      - "~/.cache/google-chrome"
      - "~/.cache/chromium"
      - "~/.mozilla/firefox/*/cache2"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Browsers re-download images and web files - no passwords or bookmarks lost."

  - id: lin_journal
    name: "System journal (older than 7 days)"
    level: 1
    os: [linux]
    special: journal
    requires_admin: true
    risk: low
    default_on: true
    action: delete
    impact: "Only system logs older than 7 days."
    note: "Runs: journalctl --vacuum-time=7d"

  # ================= MỨC 2 — NÂNG CAO (cần admin) =================
  - id: win_system_temp
    name: "Windows Temp"
    level: 2
    os: [windows]
    paths: ["%SystemRoot%\\Temp"]
    patterns: ["*"]
    exclude: []
    min_age_days: 1
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    impact: "No effect (old files only, locked files skipped)."
    note: "Only files older than 1 day; locked files are skipped"

  - id: win_update_cache
    name: "Windows Update download cache"
    level: 2
    os: [windows]
    special: update_cache
    requires_admin: true
    risk: low
    default_on: true
    action: delete
    impact: "Windows re-downloads updates if needed. Safe."
    note: "Stops the wuauserv service before deleting, restarts it after"

  - id: win_dism_cleanup
    name: "WinSxS cleanup (DISM)"
    level: 2
    os: [windows]
    special: dism_cleanup
    requires_admin: true
    risk: low
    default_on: true
    action: delete
    impact: "Microsoft's own cleanup tool. Installed updates are unaffected."
    note: "Microsoft's own tool; takes a few minutes"

  - id: win_windows_old
    name: "Windows.old (previous Windows)"
    level: 2
    os: [windows]
    paths: ["C:\\Windows.old", "C:\\$Windows.~BT", "C:\\$Windows.~WS"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: true
    risk: medium
    default_on: true
    action: quarantine
    impact: "You will no longer be able to roll back to the previous Windows version."
    warning: "Deleting it means no rollback to the previous Windows"

  - id: win_cbs_logs
    name: "CBS logs"
    level: 2
    os: [windows]
    paths: ["%SystemRoot%\\Logs\\CBS", "%SystemRoot%\\Panther"]
    patterns: ["*.log", "*.cab", "*.etl"]
    exclude: []
    min_age_days: 1
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    impact: "Just log files - no system effect."

  - id: win_dumps
    name: "Crash dump files"
    level: 2
    os: [windows]
    paths: ["%SystemRoot%\\Minidump\\*.dmp", "%SystemRoot%\\MEMORY.DMP"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    impact: "Loses crash debug files - only needed if you analyze crashes."
    note: "MEMORY.DMP is usually as large as your RAM"

  - id: win_font_icon_cache
    name: "Font/icon cache"
    level: 2
    os: [windows]
    paths:
      - "%LOCALAPPDATA%\\Microsoft\\Windows\\Explorer\\iconcache*.db"
      - "%SystemRoot%\\ServiceProfiles\\LocalService\\AppData\\Local\\FontCache*.dat"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    impact: "Windows rebuilds it - the screen may flicker during rebuild."
    note: "Screen may flicker during rebuild, goes away by itself"

  - id: win_orphan_apps
    name: "Leftover data of uninstalled apps"
    level: 2
    os: [windows]
    special: orphan_apps
    requires_admin: false
    risk: medium
    default_on: false
    action: quarantine
    impact: "Folders belonging to removed apps - review the list before cleaning."
    note: "Suggestions only (high/medium confidence) - tick items yourself. Off by default"

  - id: win_patchcache
    name: "Old installer patches"
    level: 2
    os: [windows]
    paths: ["%SystemRoot%\\Installer\\$PatchCache$"]
    patterns: ["*.msp"]
    exclude: []
    min_age_days: 30
    requires_admin: true
    risk: medium
    default_on: false
    action: quarantine
    impact: "Only .msp patches older than 30 days. Original .msi files are untouched."
    note: "Never deletes original .msi files - only .msp older than 30 days"

  - id: win_delivery_opt
    name: "Delivery Optimization cache"
    level: 2
    os: [windows]
    paths:
      - "%SystemRoot%\\SoftwareDistribution\\DeliveryOptimization"
      - "%PROGRAMDATA%\\Microsoft\\Windows\\DeliveryOptimization"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    impact: "Windows re-downloads it if update sharing is needed."

  # ================= MỨC 3 — CHUYÊN SÂU (admin + xác nhận) =================
  - id: win_deep_pattern
    name: "Deep junk patterns on C:"
    level: 3
    os: [windows]
    paths: ["C:\\"]
    patterns: ["*.tmp", "*.temp", "*.log", "*.bak", "*.old", "*.dmp", "*.chk", "thumbs.db"]
    exclude: []
    min_age_days: 1
    requires_admin: true
    risk: medium
    default_on: true
    action: quarantine
    impact: "Only junk matched by pattern (*.tmp, *.log...) - protected system folders excluded."
    note: "Protected system folders (System32, WinSxS, Installer) and Documents/Desktop/Downloads/Pictures/Videos are never touched. Matched files go to quarantine (restorable) - review before Delete permanently. Scan may take a while"

  - id: win_dev_caches
    name: "Developer caches (npm/pip/cargo/...)"
    level: 3
    os: [windows]
    paths:
      - "%APPDATA%\\npm-cache"
      - "%LOCALAPPDATA%\\Yarn\\Cache"
      - "%LOCALAPPDATA%\\pip\\Cache"
      - "%USERPROFILE%\\.cargo\\registry\\cache"
      - "%USERPROFILE%\\.gradle\\caches"
      - "%USERPROFILE%\\.nuget\\packages"
    patterns: ["*"]
    exclude: []
    min_age_days: 7
    requires_admin: false
    risk: low
    default_on: false
    action: quarantine
    impact: "Dev tools re-download caches - first build is slower."
    note: "OPT-IN: only enable if you are a developer. First build after cleaning is slower"

  - id: win_docker
    name: "Unused Docker data"
    level: 3
    os: [windows, linux]
    special: docker_prune
    requires_admin: false
    risk: medium
    default_on: false
    action: delete
    impact: "Unused images/containers are lost - pull/build again."
    note: "Volumes (container data) are not deleted"

  - id: win_hibernate
    name: "Disable Hibernate (removes hiberfil.sys)"
    level: 3
    os: [windows]
    special: hibernate_off
    requires_admin: true
    risk: high
    default_on: false
    action: delete
    impact: "You lose Hibernate mode and Fast Startup."
    warning: "Loses Hibernate + Fast Startup. Only do this if you never use Hibernate"

  - id: win_old_restore_points
    name: "Old restore points (keep newest)"
    level: 3
    os: [windows]
    special: old_restore_points
    requires_admin: true
    risk: high
    default_on: false
    action: delete
    impact: "Less ability to roll back the system after a problem."
    warning: "Reduces the ability to roll back the system after a failure"

  - id: win_dism_resetbase
    name: "DISM ResetBase"
    level: 3
    os: [windows]
    special: dism_resetbase
    requires_admin: true
    risk: high
    default_on: false
    action: delete
    impact: "CANNOT be undone - installed Windows updates can't be removed afterwards."
    warning: "CANNOT BE UNDONE: installed Windows updates can't be removed afterwards"

  # ================= LINUX mức 2 =================
  - id: lin_apt_cache
    name: "APT package cache"
    level: 2
    os: [linux]
    special: apt_clean
    requires_admin: true
    risk: low
    default_on: true
    action: delete
    impact: "apt re-downloads .deb files when needed."

  - id: lin_snap_old
    name: "Old snap revisions"
    level: 2
    os: [linux]
    special: snap_old
    requires_admin: true
    risk: low
    default_on: true
    action: delete
    impact: "Only disabled old snap revisions."

  - id: lin_var_log
    name: "Old system logs"
    level: 2
    os: [linux]
    paths: ["/var/log"]
    patterns: ["*.gz", "*.1", "*.2", "*.3", "*.4", "*.old"]
    exclude: []
    min_age_days: 7
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    impact: "Only compressed or old logs."

  - id: lin_old_kernels
    name: "Old kernels"
    level: 2
    os: [linux]
    special: old_kernels
    requires_admin: true
    risk: medium
    default_on: false
    action: delete
    impact: "Never removes the running kernel. Always keeps the 2 newest as backup."
    note: "Never removes the running kernel"

  - id: lin_orphan_apps
    name: "Leftover data of uninstalled apps"
    level: 2
    os: [linux]
    special: orphan_apps
    requires_admin: false
    risk: medium
    default_on: false
    action: quarantine
    impact: "Folders belonging to removed apps - review the list before cleaning."
    note: "Suggestions only - off by default"

  # ================= LINUX mức 3 =================
  - id: lin_deep_pattern
    name: "Deep junk patterns in home folder"
    level: 3
    os: [linux]
    paths: ["~"]
    patterns: ["*.tmp", "*.temp", "*.log", "*.bak", "*.old", "*.dmp", "*.chk"]
    exclude: []
    min_age_days: 1
    requires_admin: false
    risk: medium
    default_on: true
    action: quarantine
    impact: "Only junk matched by pattern - Documents/Desktop/Downloads excluded."
    note: "Skips Documents/Desktop/Downloads"

  - id: lin_dev_caches
    name: "Developer caches (npm/pip/cargo/...)"
    level: 3
    os: [linux]
    paths:
      - "~/.npm"
      - "~/.cache/yarn"
      - "~/.cache/pip"
      - "~/.cargo/registry/cache"
      - "~/.gradle/caches"
    patterns: ["*"]
    exclude: []
    min_age_days: 7
    requires_admin: false
    risk: low
    default_on: false
    action: quarantine
    impact: "Dev tools re-download caches - first build is slower."
    note: "OPT-IN: only enable if you are a developer"

  # ============ BỔ SUNG: vị trí dọn giá trị cao (an toàn) ============
  - id: win_inetcache
    name: "Old IE/Edge web cache (INetCache)"
    level: 1
    os: [windows]
    paths: ["%LOCALAPPDATA%\\Microsoft\\Windows\\INetCache"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "No effect - just old web temp files."

  - id: win_d3d_cache
    name: "DirectX shader cache (D3DSCache)"
    level: 1
    os: [windows]
    paths: ["%LOCALAPPDATA%\\D3DSCache"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Games/apps rebuild shaders - first run may be slightly slower."

  - id: win_teams_cache
    name: "Microsoft Teams cache"
    level: 1
    os: [windows]
    paths:
      - "%APPDATA%\\Microsoft\\Teams\\Cache"
      - "%APPDATA%\\Microsoft\\Teams\\Code Cache"
      - "%APPDATA%\\Microsoft\\Teams\\GPUCache"
      - "%APPDATA%\\Microsoft\\Teams\\tmp"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Teams re-downloads data - first launch slower, no need to sign in again."

  - id: win_spotify_cache
    name: "Spotify cache (keeps offline music)"
    level: 1
    os: [windows]
    paths:
      - "%LOCALAPPDATA%\\Spotify\\Data"
      - "%LOCALAPPDATA%\\Spotify\\Browser\\Cache"
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    note: "Does not touch the Storage folder (offline music)"
    impact: "Spotify re-downloads cover art - offline music is NOT deleted."

  - id: win_defender_history
    name: "Windows Defender scan history"
    level: 2
    os: [windows]
    paths: ["%PROGRAMDATA%\\Microsoft\\Windows Defender\\Scans\\History"]
    patterns: ["*"]
    exclude: []
    min_age_days: 7
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    note: "This folder often grows large over time"
    impact: "Only old scan history is lost - protection is unaffected."

  - id: win_driver_installers
    name: "Leftover driver installers (C:/NVIDIA, C:/AMD, C:/Intel)"
    level: 2
    os: [windows]
    paths: ["C:\\NVIDIA", "C:\\AMD", "C:\\Intel"]
    patterns: ["*"]
    exclude: []
    min_age_days: 7
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    note: "Extracted driver installer folders, often several GB"
    impact: "Safe if your drivers run fine. Re-download from the vendor to reinstall."

  - id: win_msoffice_cache
    name: "Office install cache (MSOCache)"
    level: 2
    os: [windows]
    paths: ["C:\\MSOCache"]
    patterns: ["*"]
    exclude: []
    min_age_days: 0
    requires_admin: true
    risk: medium
    default_on: false
    action: quarantine
    impact: "You will not be able to repair Office offline without the original files."

  - id: win_office_filecache
    name: "Office/OneDrive file cache"
    level: 2
    os: [windows]
    paths: ["%LOCALAPPDATA%\\Microsoft\\Office\\16.0\\OfficeFileCache"]
    patterns: ["*"]
    exclude: []
    min_age_days: 1
    requires_admin: false
    risk: low
    default_on: true
    action: quarantine
    impact: "Office/OneDrive re-syncs when you open files."

  - id: win_steam_temp
    name: "Steam temp files (unfinished downloads)"
    level: 2
    os: [windows]
    paths:
      - "%PROGRAMFILES(X86)%\\Steam\\steamapps\\downloading"
      - "%PROGRAMFILES(X86)%\\Steam\\steamapps\\temp"
      - "%PROGRAMFILES%\\Steam\\steamapps\\downloading"
      - "%PROGRAMFILES%\\Steam\\steamapps\\temp"
    patterns: ["*"]
    exclude: []
    min_age_days: 1
    requires_admin: true
    risk: low
    default_on: true
    action: quarantine
    note: "Installed games (common folder) are untouched"
    impact: "Removes unfinished downloads and temp files."

  - id: win_itunes_backup
    name: "iPhone/iPad backups (iTunes)"
    level: 2
    os: [windows]
    paths: ["%APPDATA%\\Apple Computer\\MobileSync\\Backup"]
    patterns: ["*"]
    exclude: []
    min_age_days: 30
    requires_admin: false
    risk: medium
    default_on: false
    action: quarantine
    note: "iTunes backups are often huge (tens of GB)"
    impact: "Deletes iPhone/iPad backups - only if you are sure you don't need them."
